<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Grid</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .game-card {
      position: relative;
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      overflow: hidden;
      height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }

    .game-info {
      background-color: rgba(255, 255, 255, 0.85);
      padding: 15px;
      text-align: center;
    }

    .game-info h3 {
      margin: 10px 0;
      font-size: 1.1em;
      color: #333;
    }

    .play-btn {
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      color: #fff;
      padding: 10px 18px;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .play-btn:hover {
      background: linear-gradient(135deg, #5a7dfb, #956be3);
      transform: scale(1.05);
    }

    .header {
      text-align: center;
      padding: 40px 20px 10px;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #13b413b2, #16c972, #0ed536);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: glow 3s ease-in-out infinite alternate;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 8px #d76513, 0 0 16px #e23011;
      }
      to {
        text-shadow: 0 0 16px #00ffcc, 0 0 24px #00ffcc;
      }
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>INNOVATION ENGINEERS</h1>
  </div>
  <div class="game-grid">
    <div class="game-card" style="background-image: url('tic-tac-toe.jpg');">
      <div class="game-info">
        <h3>Tic Tac Toe (Unbeatable AI)</h3>
        <button class="play-btn" onclick="window.location.href = 'tic.html';">Play</button>
       
      </div>
    </div>

    <div class="game-card" style="background-image: url('rock-paper-scissors.jpg');">
      <div class="game-info">
        <h3>Rock Paper Scissors</h3>
        <button class="play-btn" onclick="window.location.href = 'rps.html';">Play</button>
      </div>
    </div>

    <div class="game-card" style="background-image: url('ping-pong.jpg');">
      <div class="game-info">
        <h3>Ping Pong Game (AI Paddle)</h3>
        <button class="play-btn" onclick="window.location.href = 'ping.html';">Play</button>
      </div>
    </div>

    <div class="game-card" style="background-image: url('connect-four.png');">
      <div class="game-info">
        <h3>Connect Four (Smart AI)</h3>
        <button class="play-btn" onclick="window.location.href = 'four.html';">Play</button>
      </div>
    </div>

    <div class="game-card" style="background-image: url('tank-battle.jpg');">
      <div class="game-info">
        <h3>Tank Battle (2D)</h3>
        <button class="play-btn" onclick="window.location.href = 'tank.html';">Play</button>
      </div>
    </div>

    <div class="game-card" style="background-image: url('space-shooter.jpg');">
      <div class="game-info">
        <h3>Space Shooter (vs AI)</h3>
        <button class="play-btn" onclick="window.location.href = 'space.html';">Play</button>
      </div>
    </div>
  </div>
</body>
</html>
